<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 Game Hub — Play & Master 2048</title>
  <meta name="description" content="Play 2048 online and learn how to master the game with our complete strategy guides.">
  <style>
    /* --- SITE STYLING --- */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      text-align: center;
      padding: 30px 20px;
      background: linear-gradient(135deg, #1e1e1e, #2a2a2a);
      width: 100%;
      box-sizing: border-box;
      border-bottom: 2px solid #333;
    }
    h1 { margin: 0; font-size: 2.5rem; color: #4ade80; }
    p.subtitle { color: #a3a3a3; margin-top: 10px; font-size: 1.1rem; }
    .game-container {
      width: 100%;
      max-width: 600px;
      margin: 30px auto;
      padding: 0 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .btn {
      display: inline-block;
      background-color: #4ade80;
      color: #121212;
      padding: 12px 24px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 20px;
      transition: background 0.2s;
      border: none;
      cursor: pointer;
    }
    .btn:hover { background-color: #22c55e; }

    /* --- 2048 GAME STYLING --- */
    .score-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .score-box {
      background: #333;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: bold;
    }
    .grid-container {
      position: relative;
      background: #bbada0;
      border-radius: 10px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      aspect-ratio: 1 / 1;
      box-sizing: border-box;
    }
    .grid-cell {
      background: rgba(238, 228, 218, 0.35);
      border-radius: 5px;
    }
    .tile {
      position: absolute;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      border-radius: 5px;
      transition: all 0.15s ease;
      font-size: 2rem;
      width: calc(25% - 17.5px);
      height: calc(25% - 17.5px);
      background: #eee4da;
      color: #776e65;
    }
    /* Tile Colors */
    .tile[data-value="2"] { background: #eee4da; }
    .tile[data-value="4"] { background: #ede0c8; }
    .tile[data-value="8"] { background: #f2b179; color: #f9f6f2; }
    .tile[data-value="16"] { background: #f59563; color: #f9f6f2; }
    .tile[data-value="32"] { background: #f67c5f; color: #f9f6f2; }
    .tile[data-value="64"] { background: #f65e3b; color: #f9f6f2; }
    .tile[data-value="128"] { background: #edcf72; color: #f9f6f2; font-size: 1.6rem; }
    .tile[data-value="256"] { background: #edcc61; color: #f9f6f2; font-size: 1.6rem; }
    .tile[data-value="512"] { background: #edc850; color: #f9f6f2; font-size: 1.6rem; }
    .tile[data-value="1024"] { background: #edc53f; color: #f9f6f2; font-size: 1.2rem; }
    .tile[data-value="2048"] { background: #edc22e; color: #f9f6f2; font-size: 1.2rem; }
  </style>
</head>
<body>

  <header>
    <h1>2048 Game Hub</h1>
    <p class="subtitle">Play instantly. Master the strategy.</p>
  </header>

  <main class="game-container">
    <div class="score-container">
      <div class="score-box">Score: <span id="score">0</span></div>
      <button class="btn" onclick="startGame()">New Game</button>
    </div>
    
    <!-- The Game Board -->
    <div class="grid-container" id="grid">
      <!-- Background cells -->
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
    </div>

    <a href="/strategy.html" class="btn">Read the 2048 Strategy Guide →</a>
  </main>

  <script>
    // --- 2048 GAME LOGIC ---
    let board = [];
    let score = 0;
    const gridElement = document.getElementById('grid');
    const scoreElement = document.getElementById('score');

    function startGame() {
      board = Array(4).fill(null).map(() => Array(4).fill(0));
      score = 0;
      scoreElement.innerText = score;
      addRandomTile();
      addRandomTile();
      updateUI();
    }

    function addRandomTile() {
      let emptyCells = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (board[r][c] === 0) emptyCells.push({ r, c });
        }
      }
      if (emptyCells.length > 0) {
        let randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        board[randomCell.r][randomCell.c] = Math.random() < 0.9 ? 2 : 4;
      }
    }

    function updateUI() {
      // Remove existing tiles
      document.querySelectorAll('.tile').forEach(t => t.remove());
      
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (board[r][c] !== 0) {
            let tile = document.createElement('div');
            tile.className = 'tile';
            tile.innerText = board[r][c];
            tile.setAttribute('data-value', board[r][c]);
            
            // Calculate position (Accounting for padding and gaps)
            let posX = `calc(${c * 25}% + ${10 + c * 10}px)`;
            let posY = `calc(${r * 25}% + ${10 + r * 10}px)`;
            tile.style.left = posX;
            tile.style.top = posY;
            
            gridElement.appendChild(tile);
          }
        }
      }
      scoreElement.innerText = score;
    }

    function move(direction) {
      let moved = false;
      let newBoard = Array(4).fill(null).map(() => Array(4).fill(0));

      for (let i = 0; i < 4; i++) {
        let line = [];
        for (let j = 0; j < 4; j++) {
          let r = direction === 'up' ? j : direction === 'down' ? 3 - j : i;
          let c = direction === 'left' ? j : direction === 'right' ? 3 - j : i;
          if (board[r][c] !== 0) line.push(board[r][c]);
        }

        let mergedLine = [];
        for (let j = 0; j < line.length; j++) {
          if (line[j] === line[j + 1]) {
            mergedLine.push(line[j] * 2);
            score += line[j] * 2;
            j++; // skip next
            moved = true;
          } else {
            mergedLine.push(line[j]);
          }
        }

        while (mergedLine.length < 4) mergedLine.push(0);

        for (let j = 0; j < 4; j++) {
          let r = direction === 'up' ? j : direction === 'down' ? 3 - j : i;
          let c = direction === 'left' ? j : direction === 'right' ? 3 - j : i;
          newBoard[r][c] = mergedLine[j];
          if (board[r][c] !== newBoard[r][c]) moved = true;
        }
      }

      if (moved) {
        board = newBoard;
        addRandomTile();
        updateUI();
      }
    }

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') move('up');
      if (e.key === 'ArrowDown') move('down');
      if (e.key === 'ArrowLeft') move('left');
      if (e.key === 'ArrowRight') move('right');
    });

    // Start game on load
    startGame();
  </script>
</body>
</html>
